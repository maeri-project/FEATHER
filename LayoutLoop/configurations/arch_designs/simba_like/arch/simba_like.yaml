architecture:
  version: 0.3
  subtree:
    - name: System
      attributes:
        datawidth: 8
        word_bits: 8
        technology: 45nm
      local:
        - name: MainMemory
          class: DRAM
          attributes:
            type: LPDDR4
            width: 1024
            block_size: 64
            word_bits: 16
            read_bandwidth: 128
            write_bandwidth: 128
      subtree:
        - name: ws
          local:
            - name: GlobalBuffer
              class: storage
              subclass: smartbuffer_SRAM
              attributes:
                depth: 8192
                width: 1024
                block_size: 64
                word_bits: 16
                read_bandwidth: 64
                write_bandwidth: 64
          subtree:
            - name: PE[0..15]
              local:
                - name: RegisterFile
                  class: storage
                  subclass: smartbuffer_RF
                  attributes:
                    depth: 1024
                    width: 1024
                    block_size: 64
                    word_bits: 16
                    meshX: 16
                - name: PEWeightBuffer[0..3]
                  class: storage
                  subclass: smartbuffer_RF
                  attributes:
                    depth: 64
                    width: 16
                    block_size: 1
                    word_bits: 16
                    meshX: 16
                - name: PEAccuBuffer[0..3]
                  class: storage
                  subclass: smartbuffer_RF
                  attributes:
                    depth: 64
                    width: 16
                    block_size: 1
                    word_bits: 16
                    meshX: 16
                - name: PEWeightRegs[0..15]
                  class: storage
                  subclass: reg_storage
                  attributes:
                    depth: 64
                    width: 16
                    block_size: 1
                    word_bits: 16
                    meshX: 16
                - name: LMAC[0..15]
                  class: compute
                  subclass: lmac
                  attributes:
                    datawidth: 8
                    meshX: 16
