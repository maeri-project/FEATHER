architecture:
  version: 0.2
  
  subtree:
  - name: System
    
    local:
    - name: MainMemory
      class: DRAM
      attributes:
        width: 131072
        block_size: 4096
        word_bits: 32
        read_bandwidth: 4096
        write_bandwidth: 4096
        num_ports: 1

    subtree:
    - name: Chip
      attributes:
        technology: 45nm

      local:
      - name: GlobalBuffer_VMEM[0..127]
        class: regfile
        attributes:
          depth: 32768
          width: 4096
          block_size: 1
          cluster_size: 128
          word_bits: 32
          read_bandwidth: 1
          write_bandwidth: 1
          num_ports: 1
          meshX: 128
      subtree:
      - name: PE[0..16383]
        local:
        - name: RegisterFile
          class: regfile
          attributes:
            depth: 1
            width: 32
            block_size: 1
            word_bits: 32
            meshX: 128
        - name: MACC
          class: intmac
          attributes:
            datawidth: 32
            meshX: 128
