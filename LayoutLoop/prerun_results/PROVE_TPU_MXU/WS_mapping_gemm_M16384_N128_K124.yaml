mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: GlobalBuffer_VMEM
    type: datatype
    keep:
      []
    bypass:
      - Inputs
      - Weights
      - Outputs
  - target: MainMemory
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: M1 N1 K1
    permutation: KMN
  - target: GlobalBuffer_VMEM
    type: spatial
    factors: M1 N128 K124
    permutation: MNK
    split: 2
  - target: MainMemory
    type: temporal
    factors: M16384 N1 K1
    permutation: MNK