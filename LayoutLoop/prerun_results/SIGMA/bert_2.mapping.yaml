mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Outputs
    bypass:
      - Inputs
      - Weights
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: MainMemory
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: M1 N1 K32
    permutation: KMN
  - target: GlobalBuffer
    type: spatial
    factors: M32 N8 K1
    permutation: MNK
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: M8 N6 K6
    permutation: KMN
  - target: MainMemory
    type: temporal
    factors: M2 N16 K16
    permutation: NMK