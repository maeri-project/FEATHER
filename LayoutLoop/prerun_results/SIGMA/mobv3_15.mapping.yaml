mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: GlobalBuffer
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C4 M2 R1 S1 N1 P2 Q4
    permutation: CMPQRSN
  - target: GlobalBuffer
    type: spatial
    factors: C2 M2 R1 S1 N1 P7 Q7
    permutation: CMPQRSN
    split: 4
  - target: GlobalBuffer
    type: temporal
    factors: C5 M10 R1 S1 N1 P2 Q1
    permutation: MCPRSNQ
  - target: MainMemory
    type: temporal
    factors: C1 M3 R1 S1 N1 P1 Q1
    permutation: MCRSNPQ