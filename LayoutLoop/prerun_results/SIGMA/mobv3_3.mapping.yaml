mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C4 M1 R1 S1 N1 P1 Q2
    permutation: CQMRSNP
  - target: GlobalBuffer
    type: spatial
    factors: C4 M1 R1 S1 N1 P28 Q2
    permutation: CPQMRSN
    split: 3
  - target: GlobalBuffer
    type: temporal
    factors: C1 M8 R1 S1 N1 P1 Q14
    permutation: MQCRSNP
  - target: MainMemory
    type: temporal
    factors: C1 M2 R1 S1 N1 P4 Q2
    permutation: MQPCRSN