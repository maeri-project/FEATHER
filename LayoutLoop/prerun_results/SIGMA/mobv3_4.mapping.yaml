mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
      - Outputs
    bypass:
      - Inputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C4 M8 R1 S1 N1 P1 Q1
    permutation: CMRSNPQ
  - target: GlobalBuffer
    type: spatial
    factors: C1 M1 R1 S1 N1 P16 Q14
    permutation: PQCMRSN
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: C2 M2 R1 S1 N1 P7 Q4
    permutation: MQCPRSN
  - target: MainMemory
    type: temporal
    factors: C2 M4 R1 S1 N1 P1 Q2
    permutation: CMQRSNP