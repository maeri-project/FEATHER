mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
      - Inputs
    bypass:
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C8 M1 R1 S1 N1 P1 Q7
    permutation: CQMRSNP
  - target: GlobalBuffer
    type: spatial
    factors: C4 M2 R1 S1 N1 P14 Q2
    permutation: CMPQRSN
    split: 4
  - target: GlobalBuffer
    type: temporal
    factors: C5 M14 R1 S1 N1 P1 Q1
    permutation: MCRSNPQ
  - target: MainMemory
    type: temporal
    factors: C3 M4 R1 S1 N1 P1 Q1
    permutation: MCRSNPQ