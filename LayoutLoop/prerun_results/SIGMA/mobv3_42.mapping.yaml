mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
      - Inputs
    bypass:
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C1 M6 R1 S1 N1 P1 Q1
    permutation: MCRSNPQ
  - target: GlobalBuffer
    type: spatial
    factors: C8 M2 R1 S1 N1 P14 Q1
    permutation: CMPRSNQ
    split: 3
  - target: GlobalBuffer
    type: temporal
    factors: C2 M14 R1 S1 N1 P1 Q7
    permutation: QMCRSNP
  - target: MainMemory
    type: temporal
    factors: C7 M4 R1 S1 N1 P1 Q2
    permutation: CMQRSNP