mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C2 M20 R1 S1 N1 P1 Q1
    permutation: CMRSNPQ
  - target: GlobalBuffer
    type: spatial
    factors: C15 M2 R1 S1 N1 P1 Q7
    permutation: CMQRSNP
    split: 3
  - target: GlobalBuffer
    type: temporal
    factors: C2 M2 R1 S1 N1 P1 Q1
    permutation: MCRSNPQ
  - target: MainMemory
    type: temporal
    factors: C16 M2 R1 S1 N1 P7 Q1
    permutation: CPMRSNQ