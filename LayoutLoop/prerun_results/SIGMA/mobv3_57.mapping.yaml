    factors: C2 M3 R1 S1 N1 P1 Q7
    permutation: CMQRSNP
  - target: GlobalBuffer
    type: spatial
    factors: C5 M40 R1 S1 N1 P1 Q1
    permutation: CMRSNPQ
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: C4 M8 R1 S1 N1 P7 Q1
