mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
      - Inputs
    bypass:
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C2 M4 R3 S1 N1 P7 Q1
    permutation: CMRPSNQ
  - target: GlobalBuffer
    type: spatial
    factors: C32 M8 R1 S1 N1 P1 Q1
    permutation: CMRSNPQ
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: C2 M8 R1 S3 N1 P1 Q7
    permutation: QMSCRNP
  - target: MainMemory
    type: temporal
    factors: C4 M2 R1 S1 N1 P1 Q1
    permutation: CMRSNPQ