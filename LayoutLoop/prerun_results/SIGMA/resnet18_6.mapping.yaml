mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
      - Outputs
    bypass:
      - Inputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C16 M2 R1 S1 N1 P2 Q1
    permutation: CMPRSNQ
  - target: GlobalBuffer
    type: spatial
    factors: C1 M4 R3 S3 N1 P7 Q1
    permutation: MRSPCNQ
    split: 4
  - target: GlobalBuffer
    type: temporal
    factors: C4 M4 R1 S1 N1 P2 Q2
    permutation: PQMCRSN
  - target: MainMemory
    type: temporal
    factors: C1 M4 R1 S1 N1 P1 Q14
    permutation: MQCRSNP