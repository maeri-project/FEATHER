mapping:
  - target: ofmap_spad
    type: datatype
    keep:
      - Outputs
    bypass:
      - Inputs
      - Weights
  - target: weights_spad
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: RegisterFile
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: DummyBuffer
    type: datatype
    keep:
      []
    bypass:
      - Inputs
      - Weights
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: MainMemory
    type: datatype
    keep:
      - Inputs
      - Weights
      - Outputs
    bypass:
      []
  - target: ofmap_spad
    type: temporal
    factors: M1 N2 K12
    permutation: NKM
  - target: weights_spad
    type: temporal
    factors: M1 N4 K1
    permutation: NMK
  - target: RegisterFile
    type: temporal
    factors: M1 N3 K1
    permutation: NMK
  - target: DummyBuffer
    type: spatial
    factors: M4 N2 K2
    permutation: MNK
    split: 0
  - target: DummyBuffer
    type: temporal
    factors: M8 N2 K2
    permutation: MNK
  - target: GlobalBuffer
    type: spatial
    factors: M2 N2 K1
    permutation: MNK
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: M4 N1 K16
    permutation: MKN
  - target: MainMemory
    type: temporal
    factors: M2 N4 K1
    permutation: MNK