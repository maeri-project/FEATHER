mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C1 M1 R3 S1 N1 P1 Q4
    permutation: RQCMSNP
  - target: GlobalBuffer
    type: spatial
    factors: C3 M1 R1 S1 N1 P7 Q7
    permutation: CPQMRSN
    split: 3
  - target: GlobalBuffer
    type: temporal
    factors: C1 M4 R1 S1 N1 P1 Q2
    permutation: QMCRSNP
  - target: MainMemory
    type: temporal
    factors: C1 M4 R1 S3 N1 P16 Q2
    permutation: MSQPCRN