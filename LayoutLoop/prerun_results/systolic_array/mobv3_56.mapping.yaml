mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C1 M1 R1 S1 N1 P7 Q1
    permutation: PCMRSNQ
  - target: GlobalBuffer
    type: spatial
    factors: C16 M1 R1 S1 N1 P1 Q7
    permutation: CQMRSNP
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: C10 M1 R1 S1 N1 P1 Q1
    permutation: CMRSNPQ
  - target: MainMemory
    type: temporal
    factors: C6 M160 R1 S1 N1 P1 Q1
    permutation: MCRSNPQ