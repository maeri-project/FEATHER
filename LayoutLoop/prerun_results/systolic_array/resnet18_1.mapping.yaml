mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C1 M8 R1 S7 N1 P1 Q2
    permutation: MSQCRNP
  - target: GlobalBuffer
    type: spatial
    factors: C3 M1 R1 S1 N1 P8 Q8
    permutation: CPQMRSN
    split: 3
  - target: GlobalBuffer
    type: temporal
    factors: C1 M2 R1 S1 N1 P7 Q7
    permutation: PQMCRSN
  - target: MainMemory
    type: temporal
    factors: C1 M4 R7 S1 N1 P2 Q1
    permutation: RMPCSNQ